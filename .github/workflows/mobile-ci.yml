name: Mobile CI

on:
  push:
    branches:
      - feature/mobile-only-drizzle-sqlite
    paths:
      - "mobile/**"
      - "src/lib/chat/mobile-handler.ts"
      - "src/app/api/mobile-chat/route.ts"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "src/lib/chat/mobile-handler.ts"
      - "src/app/api/mobile-chat/route.ts"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Check changed files for whitespace errors
        working-directory: .
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$DIFF_BASE" =~ ^0+$ ]]; then
            git diff-tree --check --root "$GITHUB_SHA"
          else
            git diff --check "$DIFF_BASE" "$GITHUB_SHA"
          fi

      - name: Typecheck mobile source and tests
        run: npm run typecheck

      - name: Lint mobile source
        run: npm run lint

      - name: Run mobile tests (including migration and schema contracts)
        run: npm test
